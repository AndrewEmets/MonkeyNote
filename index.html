<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>monkeyscore</title>
    <meta name="description" content="A minimalistic piano sight-reading trainer." />
    <meta name="theme-color" content="#323437" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" />
    <link rel="stylesheet" href="css/style.css" />
    <script>
      // Apply the last theme before first paint to avoid a flash of the default colors.
      try {
        const vars = JSON.parse(localStorage.getItem("monkeynote.themeVars") || "null");
        if (vars) for (const k in vars) document.documentElement.style.setProperty(k, vars[k]);
      } catch {}
    </script>
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div id="app">
      <header id="top"></header>
      <main id="page"></main>
      <footer id="bottom"></footer>
    </div>
  </body>
</html>
